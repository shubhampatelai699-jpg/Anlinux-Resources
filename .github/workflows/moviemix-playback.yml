name: MovieMix playback signing

on:
  pull_request:
    paths:
      - 'moviemix/supabase/functions/signed-playback/**'
      - '.github/workflows/moviemix-playback.yml'
  push:
    paths:
      - 'moviemix/supabase/functions/signed-playback/**'
      - '.github/workflows/moviemix-playback.yml'

jobs:
  mux-jwt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test moviemix/supabase/functions/signed-playback/mux-token.test.mjs
