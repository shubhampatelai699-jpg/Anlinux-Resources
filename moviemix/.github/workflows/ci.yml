name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moviemix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moviemix/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - name: EAS preview build
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --profile preview --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moviemix/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: moviemix/admin/package-lock.json
      - run: npm ci
      - run: npm run tsc
      - run: npm run lint
      - run: npm run build
