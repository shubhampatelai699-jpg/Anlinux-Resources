apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubkami-api
  labels:
    app: dubkami-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dubkami-api
  template:
    metadata:
      labels:
        app: dubkami-api
    spec:
      containers:
        - name: api
          image: dubkami/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: dubkami-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: dubkami-api
spec:
  selector:
    app: dubkami-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
