apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubkami-worker
  labels:
    app: dubkami-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dubkami-worker
  template:
    metadata:
      labels:
        app: dubkami-worker
    spec:
      containers:
        - name: worker
          image: dubkami/api:latest
          command:
            - celery
            - -A
            - app.services.celery_app
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - secretRef:
                name: dubkami-secrets
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
# Horizontal Pod Autoscaler based on custom queue-depth metric
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dubkami-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dubkami-worker
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: celery_queue_length
        target:
          type: AverageValue
          averageValue: "5"
